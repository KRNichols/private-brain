# NUCLEAR WINTER — unleash the full test battery on free GitHub runners.
# Parallel matrix across OS × suite. Fail-fast off so we see every red.
name: Nuclear Winter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # nightly nuke (UTC)
    - cron: "17 6 * * *"

concurrency:
  group: nuclear-winter-${{ github.ref }}
  cancel-in-progress: true

env:
  PB_ENTERPRISE: "1"
  PB_CI: "1"
  PB_NONINTERACTIVE: "1"
  PB_NO_OPEN_CODEX: "1"
  PB_GODSEYE: "0"
  PB_NUCLEAR_HEADLESS: "1"
  PB_ZERO_SOFT: "1"
  PB_COVERAGE_FULL: "1"
  PB_COVERAGE_MIN: "20"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

jobs:
  # ── 1. Compile wall (fast) ─────────────────────────────────────
  py-compile:
    name: compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: py_compile all
        shell: bash
        run: |
          python - <<'PY'
          import py_compile, pathlib, sys
          errs=[]
          n=0
          for r in ["scripts","hooks","private_brain","visualizer","package/scripts"]:
            p=pathlib.Path(r)
            if not p.exists(): continue
            for f in p.rglob("*.py"):
              n+=1
              try: py_compile.compile(str(f), doraise=True)
              except Exception as e: errs.append(f"{f}: {e}")
          print("compiled", n)
          if errs:
            print("\n".join(errs[:40])); sys.exit(1)
          PY

  # ── 2. Nuclear conversation E2E (product claims + real Codex CLI) ──
  nuclear-convo:
    name: nuclear-convo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI — loop until present
        shell: bash
        run: |
          set -e
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          if [ -n "${APPDATA:-}" ] && [ -d "${APPDATA}/npm" ]; then
            export PATH="${APPDATA}/npm:${PATH}"
          fi
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          echo "$(npm prefix -g)" >> "$GITHUB_PATH"
          if [ -n "${APPDATA:-}" ] && [ -d "${APPDATA}/npm" ]; then
            echo "${APPDATA}/npm" >> "$GITHUB_PATH"
          fi
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== install loop $i/8 ==="
            npm install -g @openai/codex@latest || npm install -g @openai/codex || true
            hash -r 2>/dev/null || true
            export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
            if command -v codex >/dev/null 2>&1; then
              codex --version
              ok=1
              break
            fi
            sleep $((i * 2))
          done
          test "$ok" = "1"
          command -v codex
          codex --version
      - name: codex_cli_smoke — loop until perfect
        shell: bash
        env:
          PB_E2E_INSTALL_CODEX: "1"
          PB_E2E_CODEX_ATTEMPTS: "8"
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
        run: |
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          if [ -n "${APPDATA:-}" ] && [ -d "${APPDATA}/npm" ]; then
            export PATH="${APPDATA}/npm:${PATH}"
          fi
          export PRIVATE_BRAIN_HOME="${GITHUB_WORKSPACE}"
          for i in 1 2 3 4 5; do
            echo "=== smoke perfect loop $i/5 ==="
            if python scripts/codex_cli_smoke.py; then
              exit 0
            fi
            npm install -g @openai/codex@latest || true
            sleep $((i * 2))
          done
          exit 1
      - name: nuclear_conversation_e2e
        shell: bash
        env:
          PB_E2E_INSTALL_CODEX: "1"
          PB_E2E_CODEX_ATTEMPTS: "8"
        run: |
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          export PRIVATE_BRAIN_HOME="${GITHUB_WORKSPACE}"
          python scripts/nuclear_conversation_e2e.py
      - name: conversation_e2e multi-turn
        shell: bash
        env:
          PB_E2E_INSTALL_CODEX: "1"
          PB_E2E_CODEX_ATTEMPTS: "8"
        run: |
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          export PRIVATE_BRAIN_HOME="${GITHUB_WORKSPACE}"
          python scripts/conversation_e2e.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-convo-${{ matrix.os }}-${{ github.sha }}
          path: |
            e2e-reports/**
            .brain/state/NUCLEAR_CONVERSATION_E2E.json
            .brain/state/CONVERSATION_E2E.json
            .brain/state/CODEX_CLI_SMOKE.json
          if-no-files-found: warn
          include-hidden-files: true

  # ── 3. Nuclear x10 + fire drill + brutal (headless) ────────────
  nuclear-x10:
    name: nuclear-x10 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: nuclear_x10 (ZERO SOFT)
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_ZERO_SOFT: "1"
        run: |
          set -e
          python scripts/nuclear_x10.py
      - name: fire_drill (ZERO SOFT)
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_ZERO_SOFT: "1"
        run: |
          set -e
          python scripts/fire_drill.py
      - name: GodsEye always-live smoke (no display)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path("visualizer/graph_gl.py").read_text(encoding="utf-8", errors="replace")
          assert "Force continuous live" in g or "PB_GODSEYE_ALLOW_SETTLE" in g or "do NOT auto-freeze" in g, "GodsEye still auto-settles"
          assert "layout settled · micro-breathe" not in g or "do NOT auto-freeze" in g
          # no auto-settle energy tripwire
          assert "self.layout_settled = True" not in g or "PB_GODSEYE_ALLOW_SETTLE" in g
          print("OK GodsEye continuous live layout")
          PY

  # ── 4. Dual-OS freeze + first-boot (READY kits) ────────────────
  freeze-and-boot:
    name: freeze+boot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Freeze CORPORATE dual-OS kit
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_CI: "1"
        run: |
          set -e
          bash scripts/freeze_for_corporate
          ls -la dist/ | head -20
          test -f dist/PrivateBrain-WINDOWS-READY.zip
          test -f dist/PrivateBrain-MAC-READY.zip
      - name: Extract + START smoke (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PB_NO_OPEN_CODEX: "1"
          PB_GODSEYE: "0"
          PB_NONINTERACTIVE: "1"
        run: |
          set -e
          rm -rf kit && mkdir kit
          if [ "${{ runner.os }}" = "macOS" ]; then
            unzip -q dist/PrivateBrain-MAC-READY.zip -d kit
          else
            # linux uses mac-like START.command path if present else skip start
            unzip -q dist/PrivateBrain-MAC-READY.zip -d kit || unzip -q dist/PrivateBrain-WINDOWS-READY.zip -d kit
          fi
          test -f kit/README.md
          test -d kit/tools
          if [ -f kit/tools/install/START.command ]; then
            chmod +x kit/tools/install/START.command kit/tools/install/SETUP.command 2>/dev/null || true
            PB_NONINTERACTIVE=1 ./kit/tools/install/START.command -- --yes --route headless || \
              PB_NO_OPEN_CODEX=1 ./kit/tools/install/START.command
            test -f "${CODEX_HOME:-$HOME/.codex}/hooks.json"
          fi
      - name: Extract + START smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PB_NO_OPEN_CODEX: "1"
          PB_GODSEYE: "0"
          PB_NONINTERACTIVE: "1"
        run: |
          Expand-Archive dist/PrivateBrain-WINDOWS-READY.zip -DestinationPath kit -Force
          if (-not (Test-Path kit\README.md)) { throw "no README" }
          if (-not (Test-Path kit\tools\install\START.ps1)) { throw "no START.ps1" }
          Set-ExecutionPolicy -Scope Process Bypass
          cd kit
          try { .\tools\install\START.ps1 -Yes -Route headless -NoGodsEye } catch { .\tools\install\START.ps1 }
          $hooks = Join-Path $env:USERPROFILE ".codex\hooks.json"
          if (-not (Test-Path $hooks)) { throw "hooks.json missing" }
          Write-Host "OK windows START"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-kit-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/PrivateBrain-*-READY.zip
            dist/READY.sha256
          if-no-files-found: warn



  # ── Day-1 Kingdom (sessions · library · gateway · gitlab · neo4j) ──

  # ── Force-feed public OSS (real network crawl) ─────────────────

  # ── Coverage judge (every package module exercised) ────────────
  coverage-judge:
    name: coverage-judge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install coverage
        shell: bash
        run: python -m pip install -q coverage
      - name: Judge every script line touched on runner
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_COVERAGE_MIN: "15"
          PB_COVERAGE_FULL: "1"
          PB_GITLAB_CRAWL: "0"
        run: |
          set -e
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python scripts/judge_package_coverage.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-judge-${{ matrix.os }}-${{ github.sha }}
          path: .brain/state/PACKAGE_COVERAGE_JUDGE.json
          if-no-files-found: warn

  force-feed-public:
    name: force-feed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Force-feed public GitLab/GitHub/Jira/Confluence
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_FORCE_FEED_TINY: "1"
          PB_ZERO_SOFT: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python scripts/ci_force_feed_public.py
      - name: Beast heal + hard re-run if force-feed red
        if: failure()
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_ZERO_SOFT: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python - <<'PY'
          import os, sys
          sys.path.insert(0,"scripts")
          os.environ["PB_ENTERPRISE"]="1"
          os.environ["PB_ZERO_SOFT"]="1"
          print("BEAST — heal + full force-feed re-run (zero soft: no skip env)")
          try:
            from enterprise import self_heal, ensure_enterprise_profile
            ensure_enterprise_profile(); print(self_heal())
          except Exception as e:
            print("heal error", e); raise
          os.environ["PB_FORCE_FEED_TINY"]="1"
          import runpy
          sys.argv=["ci_force_feed_public.py"]
          # re-run must exit 0 or job stays red
          try:
            runpy.run_path("scripts/ci_force_feed_public.py", run_name="__main__")
          except SystemExit as se:
            if se.code not in (0, None):
              raise SystemExit(se.code)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-force-feed-${{ matrix.os }}-${{ github.sha }}
          path: |
            .brain/state/CI_FORCE_FEED_PUBLIC.json
            e2e-reports/**
          if-no-files-found: warn
          include-hidden-files: true

  rag-issue-golden:
    name: rag-issue-golden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI
        shell: bash
        run: |
          set -e
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          npm install -g @openai/codex@latest || npm install -g @openai/codex
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          if [ -n "${APPDATA:-}" ] && [ -d "${APPDATA}/npm" ]; then echo "${APPDATA}/npm" >> "$GITHUB_PATH"; fi
          command -v codex
          codex --version
      - name: Ultimate RAG issue golden E2E
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_ZERO_SOFT: "1"
          PB_GOLDEN_MIN_OVERLAP: "0.28"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python scripts/rag_issue_golden_e2e.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-rag-golden-${{ matrix.os }}-${{ github.sha }}
          path: |
            e2e-reports/**
            .brain/state/RAG_ISSUE_GOLDEN_E2E.json
          if-no-files-found: warn
          include-hidden-files: true

  day1-kingdom:
    name: day1-kingdom (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Nuclear Day-1 Kingdom E2E
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_GITLAB_CRAWL: "0"
        run: |
          set -e
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python scripts/nuclear_day1_kingdom_e2e.py
      - name: Unleash beast heal on failure
        if: failure()
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          os.environ["PB_ENTERPRISE"] = "1"
          print("BEAST HEAL — enterprise self_heal + day1 re-run")
          try:
              from enterprise import self_heal, ensure_enterprise_profile
              ensure_enterprise_profile()
              print("heal", self_heal())
          except Exception as e:
              print("heal soft", e)
          try:
              from day1_auto_discover import run
              r = run(sessions=True, gitlab_crawl=False, force_sessions=True, quiet=False)
              print("rediscover keys", list((r.get("phases") or {})))
          except Exception as e:
              print("rediscover soft", e)
              sys.exit(1)
          PY
          # re-run kingdom e2e hard
          python scripts/nuclear_day1_kingdom_e2e.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-day1-kingdom-${{ matrix.os }}-${{ github.sha }}
          path: .brain/state/NUCLEAR_DAY1_KINGDOM_E2E.json
          if-no-files-found: warn

  # ── RAG-DAG (real orchestrate concert + hooks) ─────────────────
  rag-dag:
    name: rag-dag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [py-compile]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: RAG-DAG E2E (orchestrate concert + hooks)
        shell: bash
        env:
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python scripts/rag_dag_e2e.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-rag-dag-${{ matrix.os }}-${{ github.sha }}
          path: .brain/state/RAG_DAG_E2E.json
          if-no-files-found: warn

  # ── 5. Sanitization + path law ─────────────────────────────────
  sanitize-and-law:
    name: sanitize+law
    runs-on: ubuntu-latest
    needs: [py-compile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint sanitized branding (public vocabulary only)
        run: |
          python scripts/lint_sanitized_branding.py

      - name: brain_lib PRIVATE_BRAIN_HOME wins
        run: |
          grep -q "PRIVATE_BRAIN_HOME" scripts/brain_lib.py
          grep -q "always win\|Sideload law\|PRIVATE_BRAIN_HOME" scripts/brain_lib.py
      - name: Install-PrivateBrain Join-Path not array
        run: |
          ! grep -n 'Join-Path \$c "beast-mode.md",' Install-PrivateBrain.ps1

  # ── 6. Aggregate gate ──────────────────────────────────────────
  nuclear-winter-green:
    name: NUCLEAR WINTER GREEN
    runs-on: ubuntu-latest
    needs: [py-compile, nuclear-convo, nuclear-x10, freeze-and-boot, rag-dag, day1-kingdom, force-feed-public, rag-issue-golden, coverage-judge, sanitize-and-law]
    if: always()
    steps:
      - name: Require all upstream green
        run: |
          echo "compile=${{ needs.py-compile.result }}"
          echo "convo=${{ needs.nuclear-convo.result }}"
          echo "x10=${{ needs.nuclear-x10.result }}"
          echo "boot=${{ needs.freeze-and-boot.result }}"
          echo "rag=${{ needs.rag-dag.result }}"
          echo "kingdom=${{ needs.day1-kingdom.result }}"
          echo "feed=${{ needs.force-feed-public.result }}"
          echo "golden=${{ needs.rag-issue-golden.result }}"
          echo "cov=${{ needs.coverage-judge.result }}"
          echo "law=${{ needs.sanitize-and-law.result }}"
          # ZERO SOFT: every upstream including ultimate RAG golden must be success
          for r in \
            "${{ needs.py-compile.result }}" \
            "${{ needs.nuclear-convo.result }}" \
            "${{ needs.nuclear-x10.result }}" \
            "${{ needs.rag-dag.result }}" \
            "${{ needs.day1-kingdom.result }}" \
            "${{ needs.force-feed-public.result }}" \
            "${{ needs.rag-issue-golden.result }}" \
            "${{ needs.coverage-judge.result }}" \
            "${{ needs.sanitize-and-law.result }}" \
            "${{ needs.freeze-and-boot.result }}"; do
            if [ "$r" != "success" ]; then
              echo "NUCLEAR WINTER RED — upstream not success: $r"
              exit 1
            fi
          done
          echo "NUCLEAR WINTER GREEN — every suite hard-green (zero soft + ultimate RAG golden)"
