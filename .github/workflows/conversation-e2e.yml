# NUCLEAR conversational E2E on free GitHub-hosted runners (ubuntu + windows + macos).
# Smoke-tests every production surface free runners can hit — ready-to-go proof.
name: Nuclear Conversation E2E

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "hooks/**"
      - "package/scripts/**"
      - "private_brain/**"
      - "config/**"
      - "installers/**"
      - "visualizer/**"
      - ".github/workflows/conversation-e2e.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: nuclear-convo-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuclear-conversation:
    name: nuclear-convo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nuclear Conversation E2E (full system smoke)
        shell: bash
        env:
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_NONINTERACTIVE: "1"
          PB_NO_OPEN_CODEX: "1"
          PB_GODSEYE: "0"
          PB_NUCLEAR_HEADLESS: "1"
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
          PB_E2E_REAL_CODEX: "0"
        run: |
          set -e
          python -m pip install -U pip >/dev/null
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
          export PRIVATE_BRAIN_HOME="${GITHUB_WORKSPACE}"
          # Primary: nuclear conversational suite (every surface)
          python scripts/nuclear_conversation_e2e.py
          # Secondary: deeper multi-turn SimCodex (if separate script still present)
          if [ -f scripts/conversation_e2e.py ]; then
            python scripts/conversation_e2e.py
          fi

      - name: Upload nuclear conversation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-convo-e2e-${{ matrix.os }}-${{ github.sha }}
          path: |
            .brain/state/NUCLEAR_CONVERSATION_E2E.json
            .brain/state/CONVERSATION_E2E.json
            **/NUCLEAR_CONVERSATION_E2E.json
            **/CONVERSATION_E2E.json
          if-no-files-found: warn
