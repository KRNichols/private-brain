# NUCLEAR conversational E2E on free GitHub-hosted runners (ubuntu + windows + macos).
# Smoke-tests every production surface free runners can hit — ready-to-go proof.
name: Nuclear Conversation E2E

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "hooks/**"
      - "package/scripts/**"
      - "private_brain/**"
      - "config/**"
      - "installers/**"
      - "visualizer/**"
      - ".github/workflows/conversation-e2e.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: nuclear-convo-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuclear-conversation:
    name: nuclear-convo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Real Codex CLI is the product surface — install + hard smoke (soft-skip banned)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI — loop until present
        shell: bash
        run: |
          set -e
          # Heal PATH for global npm bins (Unix + Windows runners)
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          if [ -n "${APPDATA:-}" ] && [ -d "${APPDATA}/npm" ]; then
            export PATH="${APPDATA}/npm:${PATH}"
          fi
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          echo "$(npm prefix -g)" >> "$GITHUB_PATH"
          if [ -n "${APPDATA:-}" ] && [ -d "${APPDATA}/npm" ]; then
            echo "${APPDATA}/npm" >> "$GITHUB_PATH"
          fi
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== install loop $i/8 ==="
            npm install -g @openai/codex@latest || npm install -g @openai/codex || true
            hash -r 2>/dev/null || true
            export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
            if command -v codex >/dev/null 2>&1; then
              codex --version
              codex --help >/dev/null
              codex exec --help >/dev/null
              echo "CODEX PRESENT on attempt $i"
              ok=1
              break
            fi
            echo "codex missing — retry install"
            sleep $((i * 2))
          done
          if [ "$ok" != "1" ]; then
            echo "FATAL: codex still missing after install loop"
            exit 1
          fi
          command -v codex
          codex --version

      - name: Hard Codex CLI smoke — loop until perfect
        shell: bash
        env:
          PB_CI: "1"
          PB_NO_OPEN_CODEX: "1"
          PB_E2E_INSTALL_CODEX: "1"
          PB_E2E_CODEX_ATTEMPTS: "8"
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
        run: |
          set -e
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          if [ -n "${APPDATA:-}" ] && [ -d "${APPDATA}/npm" ]; then
            export PATH="${APPDATA}/npm:${PATH}"
          fi
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
          # Outer shell loop: never accept a one-shot fail if install can heal
          for i in 1 2 3 4 5; do
            echo "=== smoke perfect loop $i/5 ==="
            if python scripts/codex_cli_smoke.py; then
              echo "SMOKE PERFECT"
              exit 0
            fi
            echo "smoke not perfect — reinstall + retry"
            npm install -g @openai/codex@latest || true
            sleep $((i * 2))
          done
          echo "FATAL: codex smoke never perfect"
          exit 1

      - name: Nuclear Conversation E2E (full system smoke)
        shell: bash
        env:
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_NONINTERACTIVE: "1"
          PB_NO_OPEN_CODEX: "1"
          PB_GODSEYE: "0"
          PB_NUCLEAR_HEADLESS: "1"
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
          PB_E2E_INSTALL_CODEX: "1"
          PB_E2E_CODEX_ATTEMPTS: "8"
          PB_ZERO_SOFT: "1"
          # Live agent needs auth secrets — CLI hard smoke is mandatory; exec optional
          PB_E2E_CODEX_EXEC: "0"
        run: |
          set -e
          python -m pip install -U pip >/dev/null
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
          export PRIVATE_BRAIN_HOME="${GITHUB_WORKSPACE}"
          # Primary: nuclear conversational suite (every surface + real codex CLI)
          python scripts/rag_dag_e2e.py
          python scripts/nuclear_day1_kingdom_e2e.py
          python scripts/nuclear_conversation_e2e.py
          # Secondary: deeper multi-turn SimCodex (if separate script still present)
          if [ -f scripts/conversation_e2e.py ]; then
            python scripts/conversation_e2e.py
          fi

      - name: Upload nuclear conversation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-convo-e2e-${{ matrix.os }}-${{ github.sha }}
          path: |
            e2e-reports/**
            .brain/state/NUCLEAR_CONVERSATION_E2E.json
            .brain/state/CONVERSATION_E2E.json
            .brain/state/CODEX_CLI_SMOKE.json
            **/NUCLEAR_CONVERSATION_E2E.json
            **/CONVERSATION_E2E.json
            **/CODEX_CLI_SMOKE.json
          if-no-files-found: warn
          include-hidden-files: true
