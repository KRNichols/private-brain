# Private Brain — PR / push CI
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-nuclear:
    name: nuclear (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional deps
        shell: bash
        run: |
          python -m pip install -U pip
          if [ -f visualizer/requirements.txt ]; then
            pip install -r visualizer/requirements.txt || true
          fi
      - name: py_compile
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import py_compile, pathlib, sys
          roots = ["scripts", "hooks", "private_brain", "visualizer"]
          errs = []
          n = 0
          for r in roots:
              p = pathlib.Path(r)
              if not p.exists():
                  continue
              for f in p.rglob("*.py"):
                  n += 1
                  try:
                      py_compile.compile(str(f), doraise=True)
                  except Exception as e:
                      errs.append(f"{f}: {e}")
          print("compiled", n)
          if errs:
              print("\n".join(errs[:20]))
              sys.exit(1)
          PY
      - name: Nuclear x10 (ZERO SOFT — fail is fail)
        shell: bash
        env:
          PB_ENTERPRISE: "1"
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_NUCLEAR_HEADLESS: "1"
          PB_CI: "1"
          PB_ZERO_SOFT: "1"
        run: |
          set -e
          if [ -f scripts/nuclear_x10.py ]; then
            python scripts/nuclear_x10.py
          elif [ -f scripts/nuclear_zero_fail.py ]; then
            python scripts/nuclear_zero_fail.py
          else
            echo "FATAL: nuclear_x10.py missing"
            exit 1
          fi

  windows-paths:
    name: windows paths
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: pwsh
        run: |
          $need = @("Install-PrivateBrain.ps1","installers/windows/START.ps1","scripts/beastMode.cmd","scripts/enterprise.py")
          foreach ($p in $need) {
            if (-not (Test-Path $p)) { throw "missing $p" }
            Write-Host "OK $p"
          }
          if (-not (Select-String -Path scripts/beastMode.cmd -Pattern "dangerously-bypass-approvals-and-sandbox" -Quiet)) {
            throw "missing danger bypass"
          }

  macos-paths:
    name: macos paths
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          set -e
          test -f scripts/beastMode
          test -f scripts/enterprise.py
          test -f installers/mac/START.command || test -f scripts/freeze_for_corporate
          grep -q "dangerously-bypass-approvals-and-sandbox" scripts/beastMode
          echo OK mac paths

  conversation-contracts-smoke:
    name: conversation contracts smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI — loop until present
        run: |
          set -e
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== install loop $i/8 ==="
            npm install -g @openai/codex@latest || npm install -g @openai/codex || true
            hash -r 2>/dev/null || true
            export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
            if command -v codex >/dev/null 2>&1; then
              codex --version
              ok=1
              break
            fi
            sleep $((i * 2))
          done
          test "$ok" = "1"
          command -v codex
          codex --version
      - name: Hard Codex CLI smoke — loop until perfect
        env:
          PB_CI: "1"
          PB_NO_OPEN_CODEX: "1"
          PB_E2E_INSTALL_CODEX: "1"
          PB_E2E_CODEX_ATTEMPTS: "8"
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
        run: |
          set -e
          export PATH="$(npm prefix -g)/bin:$(npm prefix -g):${PATH}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          for i in 1 2 3 4 5; do
            echo "=== smoke perfect loop $i/5 ==="
            if python scripts/codex_cli_smoke.py; then
              exit 0
            fi
            npm install -g @openai/codex@latest || true
            sleep $((i * 2))
          done
          exit 1
      - name: Run conversation_e2e
        env:
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_NONINTERACTIVE: "1"
          PB_NO_OPEN_CODEX: "1"
          PB_GODSEYE: "0"
          PB_E2E_INSTALL_CODEX: "1"
          PB_E2E_CODEX_ATTEMPTS: "8"
          PB_ZERO_SOFT: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python scripts/rag_dag_e2e.py
          python scripts/nuclear_day1_kingdom_e2e.py
          python scripts/nuclear_conversation_e2e.py
          python scripts/conversation_e2e.py

  force-feed-public-smoke:
    name: force-feed public OSS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Force-feed public sources
        env:
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_ZERO_SOFT: "1"
          PB_FORCE_FEED_TINY: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          export PRIVATE_BRAIN_HOME="${GITHUB_WORKSPACE}"
          python scripts/ci_force_feed_public.py

  rag-issue-golden:
    name: RAG issue golden (ultimate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI
        run: |
          set -e
          npm install -g @openai/codex@latest
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          command -v codex
          codex --version
      - name: Ultimate RAG issue golden E2E
        env:
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_ZERO_SOFT: "1"
          PB_NO_OPEN_CODEX: "1"
          PB_GOLDEN_MIN_OVERLAP: "0.28"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
        run: |
          set -e
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          python scripts/rag_issue_golden_e2e.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-issue-golden-${{ github.sha }}
          path: |
            e2e-reports/**
            .brain/state/RAG_ISSUE_GOLDEN_E2E.json
          if-no-files-found: warn
          include-hidden-files: true

  sanitize-branding:
    name: sanitize branding lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail on residual customer branding tokens
        run: python scripts/lint_sanitized_branding.py

  coverage-judge:
    name: package coverage judge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install coverage
        run: python -m pip install -q coverage
      - name: Judge every package module on runner
        env:
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PB_COVERAGE_MIN: "15"
          PB_COVERAGE_FULL: "1"
          PB_GITLAB_CRAWL: "0"
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts:${GITHUB_WORKSPACE}"
          export PRIVATE_BRAIN_HOME="${GITHUB_WORKSPACE}"
          python scripts/judge_package_coverage.py

