# Private Brain — PR / push CI (public repo friendly)
# Real results: compile + nuclear headless on three OSes.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-nuclear:
    name: nuclear (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps (stdlib core; optional visualizer soft)
        run: |
          python -m pip install --upgrade pip
          # Core nuclear/fire paths are stdlib-heavy; pygame optional
          if [ -f visualizer/requirements.txt ]; then
            pip install -r visualizer/requirements.txt || true
          fi

      - name: py_compile (scripts, hooks, private_brain, visualizer)
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.py' | grep -E '^(scripts|hooks|private_brain|visualizer)/' || true)
          if [ ${#files[@]} -eq 0 ]; then
            files=( $(find scripts hooks private_brain visualizer -name '*.py' 2>/dev/null || true) )
          fi
          python -m py_compile "${files[@]}"

      - name: Nuclear x10 (headless)
        env:
          PB_ENTERPRISE: "1"
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_NUCLEAR_HEADLESS: "1"
        run: |
          if [ -f scripts/nuclear_x10.py ]; then
            python scripts/nuclear_x10.py
          elif [ -f scripts/nuclear_zero_fail.py ]; then
            python scripts/nuclear_zero_fail.py
          else
            echo "No nuclear gate script yet — fail closed when engine is present"
            test ! -d scripts || exit 1
          fi

  # Windows-only path checks that need pwsh
  windows-paths:
    name: windows paths
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert Install / START / beastMode.cmd exist
        shell: pwsh
        run: |
          $need = @(
            "Install-PrivateBrain.ps1",
            "installers/windows/START.ps1",
            "scripts/beastMode.cmd",
            "scripts/enterprise.py"
          )
          foreach ($p in $need) {
            if (-not (Test-Path $p)) { Write-Error "missing $p"; exit 1 }
            Write-Host "OK $p"
          }
          Select-String -Path scripts/beastMode.cmd -Pattern "dangerously-bypass-approvals-and-sandbox" -Quiet
          if (-not $?) { exit 1 }

  # macOS-only path checks
  macos-paths:
    name: macos paths
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert Mac START / beastMode / shebangs
        run: |
          set -e
          test -f installers/mac/START.command || test -f scripts/beastMode
          test -f scripts/beastMode
          test -f scripts/enterprise.py
          head -1 scripts/beastMode | grep -q bash
          grep -q "dangerously-bypass-approvals-and-sandbox" scripts/beastMode
          echo "OK mac launcher paths"
