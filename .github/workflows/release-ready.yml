# Publish Mac + Windows READY zips to GitHub Releases (the install path).
name: Release READY kits

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Freeze dual-OS READY kits
        env:
          PB_ENTERPRISE: "1"
          PB_CI: "1"
          PRIVATE_BRAIN_HOME: ${{ github.workspace }}
          PB_NUCLEAR_HEADLESS: "1"
        run: |
          set -e
          bash scripts/freeze_for_corporate
          ls -la dist/
          test -f dist/PrivateBrain-WINDOWS-READY.zip
          test -f dist/PrivateBrain-MAC-READY.zip
      - name: Publish / update latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="ready-latest"
          # Ensure a rolling "ready-latest" release exists
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Private Brain READY kits (Mac + Windows)" \
              --notes "Download **your OS zip only**. Unzip → START → open Codex.

**Windows:** PrivateBrain-WINDOWS-READY.zip → tools\\\\install\\\\START.ps1
**Mac:** PrivateBrain-MAC-READY.zip → tools/install/START.command

Do not clone the repo to install." \
              --latest
          fi
          gh release upload "$TAG" \
            dist/PrivateBrain-WINDOWS-READY.zip \
            dist/PrivateBrain-MAC-READY.zip \
            dist/READY.sha256 \
            --clobber
          # Also attach latest CORPORATE dual-OS if present
          CORP=$(ls -t dist/PrivateBrain-CORPORATE-*.zip 2>/dev/null | head -1 || true)
          if [ -n "$CORP" ]; then
            gh release upload "$TAG" "$CORP" --clobber
          fi
          echo "Published to https://github.com/${{ github.repository }}/releases/tag/$TAG"
